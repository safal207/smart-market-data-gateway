name: Causal PR Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  causal-pr-gate:
    name: Causal PR Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BOOTSTRAP_BASE_SHA: 59ff16e72fe856cf9b284427f357a5b4bc409ffb
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact base object without credentials
        shell: bash
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 \
            "https://github.com/${BASE_REPOSITORY}.git" \
            "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Build causal transition evidence with base validator
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:scripts/ci/build_causal_pr_report.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/ci/build_causal_pr_report.py" \
              > "${RUNNER_TEMP}/build_causal_pr_report.base.py"
            python "${RUNNER_TEMP}/build_causal_pr_report.base.py" \
              --repository-path . \
              --repository "${{ github.repository }}" \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --event-path "${{ github.event_path }}" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --output-dir artifacts/causal
          elif [[ "${BASE_SHA}" == "${BOOTSTRAP_BASE_SHA}" ]]; then
            echo "bootstrap_boundary=base_has_no_causal_analyzer" >&2
            python scripts/ci/build_causal_pr_report.py \
              --repository-path . \
              --repository "${{ github.repository }}" \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --event-path "${{ github.event_path }}" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --output-dir artifacts/causal
          else
            echo "base-bound causal analyzer is missing outside the authorized bootstrap boundary" >&2
            exit 1
          fi

      - name: Verify exact-tree trust root with base checker
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:scripts/ci/check_causal_trust_root.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/ci/check_causal_trust_root.py" \
              > "${RUNNER_TEMP}/check_causal_trust_root.base.py"
            python "${RUNNER_TEMP}/check_causal_trust_root.base.py" \
              --repository-path . \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --manifest-path .github/causal-trust-root.json \
              --output artifacts/causal/trust-root-verification.json
          elif [[ "${BASE_SHA}" == "${BOOTSTRAP_BASE_SHA}" ]]; then
            echo "bootstrap_boundary=base_has_no_trust_root_checker" >&2
            python scripts/ci/check_causal_trust_root.py \
              --repository-path . \
              --base-sha "${{ github.event.pull_request.base.sha }}" \
              --head-sha "${{ github.event.pull_request.head.sha }}" \
              --manifest-path .github/causal-trust-root.json \
              --output artifacts/causal/trust-root-verification.json
          else
            echo "base-bound trust-root checker is missing outside the authorized bootstrap boundary" >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install isolated validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "pytest==9.1.1" \
            "PyYAML==6.0.3"

      - name: Validate workflow self-protection contract with base validator
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "${BASE_SHA}:scripts/ci/check_causal_workflow_contract.py" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/ci/check_causal_workflow_contract.py" \
              > "${RUNNER_TEMP}/check_causal_workflow_contract.base.py"
            python "${RUNNER_TEMP}/check_causal_workflow_contract.base.py" \
              .github/workflows/causal-pr-gate.yml \
              --default-branch main
          elif [[ "${BASE_SHA}" == "${BOOTSTRAP_BASE_SHA}" ]]; then
            echo "bootstrap_boundary=base_has_no_workflow_validator" >&2
            python scripts/ci/check_causal_workflow_contract.py \
              .github/workflows/causal-pr-gate.yml \
              --default-branch main
          else
            echo "base-bound workflow validator is missing outside the authorized bootstrap boundary" >&2
            exit 1
          fi

      - name: Run causal, trust-root, and workflow mutation tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -o addopts="" --noconftest \
            tests/test_causal_pr_contract.py \
            tests/test_causal_trust_root.py \
            tests/test_causal_workflow_contract.py

      - name: Upload exact-SHA causal evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: causal-pr-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/causal/
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL
    if: ${{ github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a2983b8bed1923f44751c5c43237f479442827b3
        with:
          languages: python
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@a2983b8bed1923f44751c5c43237f479442827b3
        with:
          category: /language:python
