name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smdg_test
          POSTGRES_USER: smdg
          POSTGRES_PASSWORD: smdg-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smdg -d smdg_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_DATABASE_URL: postgresql://smdg:smdg-test-only@localhost:5432/smdg_test
      SMDG_REDIS_URL: redis://localhost:6379/15
      SMDG_DATABASE_URL: postgresql://smdg:smdg-test-only@localhost:5432/smdg_test
      SMDG_ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Unit, integration, and contract tests
        run: pytest

      - name: Validate OpenAPI and AsyncAPI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          from smart_market_data_gateway.app import app

          schema = app.openapi()
          assert "/v1/quotes/{symbol}" in schema["paths"]
          assert "/v1/quotes" in schema["paths"]
          Path("openapi.json").write_text(json.dumps(schema, indent=2), encoding="utf-8")
          asyncapi = yaml.safe_load(Path("docs/asyncapi.yaml").read_text(encoding="utf-8"))
          assert asyncapi["asyncapi"] == "3.0.0"
          assert "/v1/stream" == asyncapi["channels"]["marketStream"]["address"]
          PY
          python scripts/check_contract_compatibility.py

      - name: Validate Docker Compose
        run: docker compose config >/dev/null

      - name: Dependency audit
        run: pip-audit

      - name: Secret-pattern scan
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          allowed = {"change-me-in-production", "replace-with-a-secret-from-your-secret-manager", "smdg-local-only", "smdg-test-only"}
          patterns = [
              re.compile(r"AKIA[0-9A-Z]{16}"),
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"ghp_[A-Za-z0-9]{30,}"),
              re.compile(r"sk-[A-Za-z0-9]{32,}"),
          ]
          findings = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or any(part in {".git", ".venv"} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              sanitized = text
              for value in allowed:
                  sanitized = sanitized.replace(value, "")
              for pattern in patterns:
                  if pattern.search(sanitized):
                      findings.append(str(path))
          if findings:
              raise SystemExit("Potential secrets found: " + ", ".join(findings))
          PY

      - name: Upload API contract
        uses: actions/upload-artifact@v4
        with:
          name: api-contract
          path: openapi.json

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e .

      - name: Run reproducible benchmark
        run: >-
          smdg-benchmark
          --clients 1000
          --symbols-per-client 20
          --symbol-universe 200
          --events-per-symbol 50
          --output benchmark-results

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: benchmark-results
