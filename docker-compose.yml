services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  postgres:
    image: timescale/timescaledb:latest-pg17@sha256:3e65c273cbf7218f2a28692492b4625b49f35c7d2142e945561ef52311a8c83a
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_DB: smdg
      POSTGRES_USER: smdg
      POSTGRES_PASSWORD: smdg-local-only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdg -d smdg"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment: &gateway-environment
      SMDG_REDIS_URL: redis://redis:6379/0
      SMDG_DATABASE_URL: postgresql://smdg:smdg-local-only@postgres:5432/smdg
      SMDG_ENVIRONMENT: development
      SMDG_ALLOW_DEV_TOKENS: "true"
      SMDG_ALLOW_ANONYMOUS_DEV: "true"
      SMDG_LOG_LEVEL: INFO
      SMDG_ACCEPTED_EVENT_MAX_AGE_SECONDS: "30"
      SMDG_CANDLE_INTERVALS_SECONDS: 1,10,60,300
      SMDG_CANDLE_ALLOWED_LATENESS_SECONDS: "2"
      SMDG_ENABLE_HISTORY_RETENTION: "false"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrate:
    build: .
    command:
      [
        "python",
        "-m",
        "smart_market_data_gateway.migrations",
        "--migrations-dir",
        "/app/migrations",
      ]
    environment:
      <<: *gateway-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  collector:
    build: .
    command: ["python", "-m", "smart_market_data_gateway.collector"]
    environment:
      <<: *gateway-environment
      SMDG_COLLECTOR_METRICS_PORT: "9101"
      SMDG_PROVIDER: ${SMDG_PROVIDER:-mock}
      SMDG_MOCK_SYMBOLS: ${SMDG_MOCK_SYMBOLS:-AAPL,TSLA,NVDA,MSFT,GOOG,AMZN,META,AMD,INTC,ORCL}
      SMDG_MOCK_INTERVAL_SECONDS: ${SMDG_MOCK_INTERVAL_SECONDS:-0.1}
      SMDG_TRADERNET_MODE: ${SMDG_TRADERNET_MODE:-public_demo}
      SMDG_TRADERNET_WEBSOCKET_URL: ${SMDG_TRADERNET_WEBSOCKET_URL:-wss://wss.tradernet.com/}
      SMDG_TRADERNET_SNAPSHOT_BASE_URL: ${SMDG_TRADERNET_SNAPSHOT_BASE_URL:-https://tradernet.com}
      SMDG_TRADERNET_SID: ${SMDG_TRADERNET_SID:-}
      SMDG_TRADERNET_USER_ID: ${SMDG_TRADERNET_USER_ID:-}
      SMDG_TRADERNET_API_KEY: ${SMDG_TRADERNET_API_KEY:-}
      SMDG_TRADERNET_API_SECRET: ${SMDG_TRADERNET_API_SECRET:-}
      SMDG_TRADERNET_REQUIRE_AUTHENTICATED_SID: ${SMDG_TRADERNET_REQUIRE_AUTHENTICATED_SID:-true}
      SMDG_TRADERNET_SNAPSHOT_FALLBACK: ${SMDG_TRADERNET_SNAPSHOT_FALLBACK:-true}
      SMDG_TRADERNET_CONNECT_TIMEOUT_SECONDS: ${SMDG_TRADERNET_CONNECT_TIMEOUT_SECONDS:-10}
      SMDG_TRADERNET_SNAPSHOT_TIMEOUT_SECONDS: ${SMDG_TRADERNET_SNAPSHOT_TIMEOUT_SECONDS:-10}
      SMDG_TRADERNET_INTEGRATION_SYMBOLS: ${SMDG_TRADERNET_INTEGRATION_SYMBOLS:-AAPL.US,MSFT.US}
    expose:
      - "9101"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  history-writer:
    build: .
    command: ["python", "-m", "smart_market_data_gateway.history"]
    environment:
      <<: *gateway-environment
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  usage-writer:
    build: .
    command: ["python", "-m", "smart_market_data_gateway.usage_sink"]
    environment:
      <<: *gateway-environment
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
      collector:
        condition: service_started

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  postgres-data:
  grafana-data:
