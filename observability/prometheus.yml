global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: smart-market-data-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: smart-market-data-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["collector:9101"]
