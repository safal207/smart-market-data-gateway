[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "smart-market-data-gateway"
version = "0.2.0"
description = "Adaptive market-data gateway with smart subscription aggregation and tier-based QoS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "safal207" }]
dependencies = [
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "PyJWT>=2.9,<3.0",
  "redis>=5.1,<6.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "detect-secrets>=1.5,<2.0",
  "mypy>=1.13,<2.0",
  "pip-audit>=2.7,<3.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.2,<2.0",
  "pytest-cov>=6.0,<7.0",
  "PyYAML>=6.0,<7.0",
  "ruff>=0.7,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
smdg-benchmark = "smart_market_data_gateway.benchmark:main"
smdg-candle-archive = "smart_market_data_gateway.candle_archive:main"
smdg-collector = "smart_market_data_gateway.collector:main"
smdg-usage-sink = "smart_market_data_gateway.usage_sink:main"

[tool.hatch.build.targets.wheel]
packages = ["src/smart_market_data_gateway"]

[tool.pytest.ini_options]
addopts = "-q --cov=smart_market_data_gateway --cov-report=term-missing --cov-fail-under=55"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
packages = ["smart_market_data_gateway"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
